[package]
name = "xcl"
description = "Xbox Series X|S -> Windows compatibility layer (loader + HLE)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "xcl"
path = "src/lib.rs"

[[bin]]
name = "xcl"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Linux: the host runtime maps images with mmap/mprotect and will need sigaction/pthread as
# Phase C/D land. `libc` is MIT OR Apache-2.0 (used under the MIT grant) and musl-friendly.
# `ash` 0.38 is MIT OR Apache-2.0 (used under the MIT grant, like `libc`): Vulkan bindings
# that `dlopen` libvulkan.so.1 at runtime via `libloading` (ISC, BSD-style), so the static
# exe ships no `.so`. Linux-only compute runner (Phase D step 15).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ash = "0.38"

# Windows-only: the host runtime (loader/hooks/HLE) is behind `cfg(windows)`; Linux gets
# clean stubs until the Phase C/D/E ports land.
[target.'cfg(windows)'.dependencies]
retour = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_Globalization",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
]
